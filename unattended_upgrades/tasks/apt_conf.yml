---
- name: Enable/disable periodic apt actions (20auto-upgrades)
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Local unattended-upgrades configuration (52unattended-upgrades-local)
  template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
