---
- name: Dump effective unattended-upgrades apt config
  shell: set -o pipefail; apt-config dump | grep -i unattended
  args:
    executable: /bin/bash
  register: _uu_aptconfig
  changed_when: false
  failed_when: _uu_aptconfig.rc > 1
  check_mode: no

- name: Dry-run unattended-upgrade
  command: unattended-upgrade --dry-run --debug
  register: _uu_dryrun
  changed_when: false
  check_mode: no
  tags: [never, uu_test]

- name: List apt timers
  command: systemctl list-timers 'apt-daily*'
  register: _uu_timers
  changed_when: false
  check_mode: no
  tags: [never, uu_test, uu_timers]
