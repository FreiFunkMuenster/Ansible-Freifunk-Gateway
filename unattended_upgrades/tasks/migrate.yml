---
# Alt: die Rolle hat die Paketdatei 50unattended-upgrades überschrieben
- name: Check for old role-managed 50unattended-upgrades
  command: grep -qsF 'Ansible managed' /etc/apt/apt.conf.d/50unattended-upgrades
  register: _uu_old50
  changed_when: false
  failed_when: false
  check_mode: no

- name: Remove old role-managed 50unattended-upgrades
  file:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    state: absent
  when: _uu_old50.rc == 0

- name: Restore package version of 50unattended-upgrades
  command: apt-get install -y --reinstall -o Dpkg::Options::=--force-confmiss unattended-upgrades
  changed_when: true
  when: _uu_old50.rc == 0 and not ansible_check_mode

# Alt: 10periodic aus dem alten Template (nur entfernen, wenn unverändert und von keinem Paket besessen)
- name: Stat old 10periodic
  stat:
    path: /etc/apt/apt.conf.d/10periodic
  register: _uu_old10

- name: Check package ownership of 10periodic
  command: dpkg -S /etc/apt/apt.conf.d/10periodic
  register: _uu_old10_owner
  changed_when: false
  failed_when: false
  check_mode: no
  when: _uu_old10.stat.exists

- name: Remove old role-managed 10periodic
  file:
    path: /etc/apt/apt.conf.d/10periodic
    state: absent
  when:
    - _uu_old10.stat.exists
    - _uu_old10.stat.checksum == _uu_old_10periodic_sha1
    - _uu_old10_owner.rc != 0
